name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install, build and deploy (choose Bun if available)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ./bun.lock ]; then
            echo "Detected bun.lock — using Bun"
            # Install Bun (install script) and ensure bun is on PATH
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL_DIR="$HOME/.bun"
            export PATH="$BUN_INSTALL_DIR/bin:$PATH"
            bun --version
            bun install
            bun run build
            # Use bunx to run gh-pages package (gh-pages is in dependencies)
            bunx gh-pages -d dist
          else
            echo "bun.lock not found — falling back to npm"
            npm install
            npm run build
            npm run deploy
          fi
