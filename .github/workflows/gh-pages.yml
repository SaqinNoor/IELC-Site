name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect bun.lock
        id: detect_bun
        run: |
          if [ -f ./bun.lock ]; then
            echo "use_bun=true" >> $GITHUB_OUTPUT
          else
            echo "use_bun=false" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js 18 (only when not using Bun)
        if: steps.detect_bun.outputs.use_bun == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: "Bun: Install, build and deploy"
        if: steps.detect_bun.outputs.use_bun == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Detected bun.lock — using Bun"
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL_DIR="$HOME/.bun"
          export PATH="$BUN_INSTALL_DIR/bin:$PATH"
          bun --version
          bun install
          bun run build
          # configure git identity so gh-pages can commit
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          bunx gh-pages -d dist

      - name: "NPM: Install, build and deploy (fallback)"
        if: steps.detect_bun.outputs.use_bun == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "bun.lock not found — using npm"
          npm install
          npm run build
          # configure git identity so gh-pages can commit
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          npm run deploy
