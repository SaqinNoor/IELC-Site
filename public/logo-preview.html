<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 20px; background: #050505; }
        .logo-container { 
            display: inline-block; 
            background: rgba(255,255,255,0.1); 
            padding: 20px; 
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
            <!-- Background circle -->
            <circle cx="40" cy="40" r="35" fill="#e50914" stroke="#ffffff" stroke-width="2"/>
            
            <!-- IELC Text -->
            <text x="40" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">IELC</text>
            
            <!-- Club name -->
            <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Ideal English</text>
            <text x="90" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Language Club</text>
            
            <!-- Decorative elements -->
            <circle cx="160" cy="20" r="3" fill="#e50914" opacity="0.6"/>
            <circle cx="170" cy="35" r="2" fill="#e50914" opacity="0.4"/>
            <circle cx="155" cy="50" r="2.5" fill="#e50914" opacity="0.5"/>
        </svg>
    </div>
</body>
</html>
